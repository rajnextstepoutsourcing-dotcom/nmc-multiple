services:
  - type: web
    name: nmc-live
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TWOCAPTCHA_API_KEY
        sync: false
      - key: GEMINI_MODEL_FAST
        value: gemini-2.0-flash
      - key: GEMINI_MODEL_STRONG
        value: gemini-2.5-pro
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXTSTEP_INTERNAL_TOKEN
        sync: false
      - key: BACKEND_VALIDATE_URL
        sync: false
      - key: APP_DASHBOARD_URL
        sync: false
      - key: APP_LOGIN_URL
        sync: false
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: NMC_ENABLE_EMBEDDED_WORKER
        value: "true"
